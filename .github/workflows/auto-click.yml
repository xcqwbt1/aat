name: ATF Bot - Telethon Only

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: atf-bot
  cancel-in-progress: false

jobs:
  auto-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Restore schedule state
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: schedule_state.json
          key: atf-schedule-${{ github.run_id }}
          restore-keys: |
            atf-schedule-
      
      - name: Check schedule
        id: schedule
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          force = os.environ.get("FORCE_RUN", "false").lower() == "true"
          due = True
          if not force:
              try:
                  with open("schedule_state.json") as f:
                      nxt = datetime.fromisoformat(json.load(f)["next_run"])
                  due = datetime.now(ZoneInfo("Asia/Tehran")) >= nxt
              except Exception:
                  due = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"due={'true' if due else 'false'}\n")
          print("due =", due)
          EOF
      
      - name: Setup Python
        if: steps.schedule.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        if: steps.schedule.outputs.due == 'true'
        run: |
          pip install --upgrade pip
          pip install telethon==1.34.0
          pip install python-dotenv==1.0.0
          pip install playwright==1.48.0
          playwright install --with-deps chromium
      
      - name: Run bot
        if: steps.schedule.outputs.due == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python src/bot_telethon.py
      
      - name: Save schedule state
        if: steps.schedule.outputs.due == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: schedule_state.json
          key: atf-schedule-${{ github.run_id }}
      
      - name: Upload debug screenshots
        if: steps.schedule.outputs.due == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            screenshots/
            action_log.json
          if-no-files-found: ignore
